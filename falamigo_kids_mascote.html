<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Falamigo Kids - Comunicador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 800px;
            position: relative;
        }

        /* === TELA INICIAL COM MASCOTE ANIMADO === */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .mascote-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 25px;
        }

        .mascote-video {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e94560;
            box-shadow: 0 0 30px rgba(233,69,96,0.5);
            background: #fff;
        }

        .mascote-ring {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%;
            border: 2px dashed rgba(233,69,96,0.4);
            animation: spinRing 10s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Indicador de "falando" */
        .speaking-indicator {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 30px;
            height: 30px;
            background: #e94560;
            border-radius: 50%;
            border: 3px solid #1a1a2e;
            display: none;
            animation: speakPulse 0.5s ease-in-out infinite alternate;
        }

        .speaking-indicator.active {
            display: block;
        }

        @keyframes speakPulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0.7; }
        }

        .welcome-title {
            color: #e94560;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .start-btn {
            padding: 16px 60px;
            border: none;
            border-radius: 50px;
            background: #e94560;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(233,69,96,0.4);
        }

        .start-btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* === HEADER === */
        .header {
            background: #0f3460;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #e94560;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            color: #e94560;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 11px;
            color: #aaa;
        }

        /* === BARRA DE FALA === */
        .speak-bar {
            background: #1a1a2e;
            padding: 12px 15px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .speak-display {
            flex: 1;
            background: #0f3460;
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 10px 15px;
            min-height: 44px;
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #fff;
            word-wrap: break-word;
        }

        .speak-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            background: #e94560;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .speak-btn:hover {
            background: #ff6b81;
        }

        .speak-btn:active {
            transform: scale(0.95);
        }

        .clear-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            background: #2d2d44;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #e94560;
        }

        /* === ABAS === */
        .tabs {
            display: flex;
            background: #0f3460;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            border: none;
            background: #0f3460;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #16213e;
            color: #e94560;
            border-bottom-color: #e94560;
        }

        .tab-btn:hover {
            background: #16213e;
            color: #fff;
        }

        /* === CONTEUDO DAS ABAS === */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content::-webkit-scrollbar {
            width: 6px;
        }

        .tab-content::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 3px;
        }

        /* === GRID DE BOTOES === */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .comm-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border: 2px solid #0f3460;
            border-radius: 16px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 100px;
        }

        .comm-btn:hover {
            border-color: #e94560;
            background: #0f3460;
            transform: translateY(-2px);
        }

        .comm-btn:active {
            transform: scale(0.95);
            background: #e94560;
        }

        .comm-btn .emoji {
            font-size: 36px;
            margin-bottom: 8px;
            display: block;
        }

        .comm-btn .label {
            font-size: 13px;
            line-height: 1.3;
        }

        .btn-comer { border-color: #ff6b6b; }
        .btn-comer:hover { background: rgba(255,107,107,0.2); }
        .btn-beber { border-color: #4ecdc4; }
        .btn-beber:hover { background: rgba(78,205,196,0.2); }
        .btn-brincar { border-color: #ffe66d; }
        .btn-brincar:hover { background: rgba(255,230,109,0.2); }
        .btn-sentir { border-color: #a8e6cf; }
        .btn-sentir:hover { background: rgba(168,230,207,0.2); }
        .btn-preciso { border-color: #ff8b94; }
        .btn-preciso:hover { background: rgba(255,139,148,0.2); }
        .btn-rotina { border-color: #c7ceea; }
        .btn-rotina:hover { background: rgba(199,206,234,0.2); }
        .btn-sos { border-color: #e94560; }
        .btn-sos:hover { background: rgba(233,69,96,0.2); }

        /* === CONFIG === */
        .config-section {
            margin-bottom: 20px;
        }

        .config-section h3 {
            color: #e94560;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #0f3460;
        }

        .config-row label {
            font-size: 14px;
            color: #ccc;
        }

        .config-row input[type="range"] {
            width: 120px;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #0f3460;
            outline: none;
        }

        .config-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }

        .config-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #e94560;
        }

        .config-row select {
            background: #0f3460;
            color: #fff;
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 13px;
        }

        /* === HISTORICO === */
        .history-item {
            background: #0f3460;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .history-item .time {
            font-size: 11px;
            color: #aaa;
        }

        .history-item .replay-btn {
            background: #e94560;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        /* === SOS === */
        .sos-btn {
            width: 100%;
            padding: 20px;
            border: 3px solid #e94560;
            border-radius: 16px;
            background: #e94560;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
            animation: pulseSos 2s infinite;
        }

        @keyframes pulseSos {
            0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.7); }
            50% { box-shadow: 0 0 20px 10px rgba(233,69,96,0.3); }
        }

        .sos-btn:hover {
            background: #ff6b81;
        }

        .sos-btn:active {
            transform: scale(0.98);
        }

        /* === RODAPE === */
        .footer {
            background: #0f3460;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            color: #aaa;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        /* === RESPONSIVO === */
        @media (max-width: 360px) {
            .mascote-container {
                width: 160px;
                height: 160px;
            }
            .welcome-title {
                font-size: 24px;
            }
            .btn-grid {
                grid-template-columns: 1fr;
            }
            .comm-btn {
                min-height: 80px;
            }
        }
    </style>
</head>

                    <label>Velocidade da fala</label>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="0.9">
                </div>

                    <label>Tom da voz</label>
                    <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1.1">
                </div>
                <div class="config-row">
                    <label>Falar automaticamente</label>
                    <input type="checkbox" id="autoSpeak" checked>
                </div>
            </div>

                <h3>Visual</h3>
                <div class="config-row">
                    <label>Tamanho dos emojis</label>
                    <select id="emojiSize">
                        <option value="28">Pequeno</option>
                        <option value="36" selected>Normal</option>
                        <option value="48">Grande</option>
                    </select>
                </div>
                <div class="config-row">
                    <label>Tamanho do texto</label>
                    <select id="textSize">
                        <option value="12">Pequeno</option>
                        <option value="14" selected>Normal</option>
                        <option value="18">Grande</option>
                    </select>
                </div>
            </div>
            <div class="config-section">
                <h3>Histórico</h3>
                <div id="historyList" style="max-height:200px; overflow-y:auto;">
                    <p style="color:#aaa; text-align:center; padding:20px;">Nenhuma frase falada ainda</p>
                </div>
                <button class="speak-btn" onclick="limparHistorico()" style="width:100%; margin-top:10px;">Limpar Histórico</button>

<script>
// ==================== VARIAVEIS ====================
var fraseAtual = "";
var historico = [];
var synth = window.speechSynthesis;
var abaAtual = "comer";
var boasVindasFaladas = false;
var videoElem = null;
var animInterval = null;
var videoDuration = 2.64; // duracao do video em segundos

// ==================== SINCRONIZACAO VIDEO + TTS ====================
function iniciarSincronizacao() {
    videoElem = document.getElementById("mascoteVideo");
    if (!videoElem) return;

    // Pausa o video no inicio (boca fechada)
    videoElem.currentTime = 0;
    videoElem.pause();
}

function animarBocaFalando() {
    if (!videoElem) return;

    // O video tem 2.64s, vamos fazer um loop rapido da parte onde a boca se move
    // Frames com boca aberta: ~0.7s a 2.3s
    // Vamos fazer um loop entre 0.5s e 2.5s

    var loopStart = 0.5;
    var loopEnd = 2.5;

    videoElem.currentTime = loopStart;
    videoElem.play();

    // Reinicia o loop quando chega no fim
    animInterval = setInterval(function() {
        if (videoElem.currentTime >= loopEnd) {
            videoElem.currentTime = loopStart;
        }
    }, 50);
}

function pararAnimacaoBoca() {
    if (animInterval) {
        clearInterval(animInterval);
        animInterval = null;
    }
    if (videoElem) {
        videoElem.pause();
        videoElem.currentTime = 0; // volta para boca fechada
    }
    document.getElementById("speakingIndicator").classList.remove("active");
}

// ==================== INICIALIZACAO ====================
function iniciarApp() {
    document.getElementById("welcomeScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "flex";

    pararAnimacaoBoca();

    if (!('speechSynthesis' in window)) {
        alert("Seu navegador não suporta fala. Use Chrome ou Safari.");
    }

    try {
        var salvo = localStorage.getItem("falamigo_historico");
        if (salvo) {
            historico = JSON.parse(salvo);
            atualizarHistorico();
        }
    } catch(e) {}

    if (synth) {
        synth.onvoiceschanged = function() {
            synth.getVoices();
        };
    }
}

function falarBoasVindas() {
    if (!synth || boasVindasFaladas) return;

    // Inicia a animacao da boca
    document.getElementById("speakingIndicator").classList.add("active");
    animarBocaFalando();

    synth.cancel();
    var utterance = new SpeechSynthesisUtterance("Olá! Seja bem-vindo ao Falamigo Kids!");
    utterance.lang = "pt-BR";
    utterance.rate = 0.9;
    utterance.pitch = 1.2;
    utterance.volume = 1.0;

    var voices = synth.getVoices();
    var ptVoice = null;
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf("pt") !== -1) {
            ptVoice = voices[i];
            break;
        }
    }
    if (ptVoice) utterance.voice = ptVoice;

    utterance.onend = function() {
        boasVindasFaladas = true;
        pararAnimacaoBoca();
    };

    utterance.onerror = function() {
        pararAnimacaoBoca();
    };

    synth.speak(utterance);
}

// ==================== ABAS ====================
function mudarAba(aba, btn) {
    abaAtual = aba;
    var botoes = document.querySelectorAll(".tab-btn");
    for (var i = 0; i < botoes.length; i++) {
        botoes[i].classList.remove("active");
    }
    btn.classList.add("active");
    var conteudos = document.querySelectorAll(".tab-content");
    for (var i = 0; i < conteudos.length; i++) {
        conteudos[i].classList.remove("active");
    }
    document.getElementById("tab-" + aba).classList.add("active");
}

// ==================== FALA ====================
function adicionarFrase(texto) {
    fraseAtual = texto;
    document.getElementById("speakDisplay").textContent = texto;
    var agora = new Date();
    var hora = agora.getHours().toString().padStart(2, '0') + ":" + 
                 agora.getMinutes().toString().padStart(2, '0');
    historico.unshift({ texto: texto, hora: hora });
    if (historico.length > 50) historico.pop();
    try {
        localStorage.setItem("falamigo_historico", JSON.stringify(historico));
    } catch(e) {}
    atualizarHistorico();
    if (document.getElementById("autoSpeak").checked) {
        falarFrase();
    }
}

function falarFrase() {
    if (!fraseAtual) {
        document.getElementById("speakDisplay").textContent = "Toque em um botão primeiro...";
        return;
    }
    if (!synth) {
        document.getElementById("speakDisplay").textContent = "TTS não disponível";
        return;
    }
    synth.cancel();
    var utterance = new SpeechSynthesisUtterance(fraseAtual);
    utterance.lang = "pt-BR";
    utterance.rate = parseFloat(document.getElementById("rateSlider").value);
    utterance.pitch = parseFloat(document.getElementById("pitchSlider").value);
    utterance.volume = document.getElementById("volumeSlider").value / 100;
    var voices = synth.getVoices();
    var ptVoice = null;
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf("pt") !== -1) {
            ptVoice = voices[i];
            break;
        }
    }
    if (ptVoice) utterance.voice = ptVoice;
    synth.speak(utterance);
}

function limparFrase() {
    fraseAtual = "";
    document.getElementById("speakDisplay").textContent = "Toque nos botões para falar...";
}

// ==================== SOS ====================
function acionarSOS() {
    var msg = "PRECISO DE AJUDA AGORA!";
    fraseAtual = msg;
    document.getElementById("speakDisplay").textContent = msg;
    for (var i = 0; i < 3; i++) {
        setTimeout(function() {
            var u = new SpeechSynthesisUtterance("Alerta! A criança precisa de ajuda urgente!");
            u.lang = "pt-BR";
            u.rate = 0.8;
            u.pitch = 1.2;
            u.volume = 1.0;
            synth.speak(u);
        }, i * 2000);
    }
    if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500, 200, 500]);
    }
    var agora = new Date();
    var hora = agora.getHours().toString().padStart(2, '0') + ":" + 
                 agora.getMinutes().toString().padStart(2, '0');
    historico.unshift({ texto: "SOS: " + msg, hora: hora });
    try {
        localStorage.setItem("falamigo_historico", JSON.stringify(historico));
    } catch(e) {}
    atualizarHistorico();
}

// ==================== HISTORICO ====================
function atualizarHistorico() {
    var lista = document.getElementById("historyList");
    if (historico.length === 0) {
        lista.innerHTML = '<p style="color:#aaa; text-align:center; padding:20px;">Nenhuma frase falada ainda</p>';
        return;
    }
    var html = "";
    for (var i = 0; i < historico.length; i++) {
        var item = historico[i];
        html += '<div class="history-item">';
        html += '<span>' + item.texto + '</span>';
        html += '<span class="time">' + item.hora + '</span>';
        html += '<button class="replay-btn" onclick="reproduzirHistorico(' + i + ')">Ouvir</button>';
        html += '</div>';
    }
    lista.innerHTML = html;
}

function reproduzirHistorico(index) {
    var texto = historico[index].texto;
    if (!synth) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = "pt-BR";
    u.rate = parseFloat(document.getElementById("rateSlider").value);
    u.pitch = parseFloat(document.getElementById("pitchSlider").value);
    u.volume = document.getElementById("volumeSlider").value / 100;
    synth.speak(u);
}

function limparHistorico() {
    historico = [];
    try {
        localStorage.removeItem("falamigo_historico");
    } catch(e) {}
    atualizarHistorico();
}

// ==================== CONFIG VISUAL ====================
document.getElementById("emojiSize").addEventListener("change", function() {
    var tamanho = this.value + "px";
    var emojis = document.querySelectorAll(".comm-btn .emoji");
    for (var i = 0; i < emojis.length; i++) {
        emojis[i].style.fontSize = tamanho;
    }
});

document.getElementById("textSize").addEventListener("change", function() {
    var tamanho = this.value + "px";
    var labels = document.querySelectorAll(".comm-btn .label");
    for (var i = 0; i < labels.length; i++) {
        labels[i].style.fontSize = tamanho;
    }
});

// ==================== CARREGAMENTO ====================
window.onload = function() {
    iniciarSincronizacao();

    // Aguarda as vozes carregarem e o video estar pronto
    setTimeout(function() {
        falarBoasVindas();
    }, 1200);
};

if (synth) {
    synth.onvoiceschanged = function() {
        synth.getVoices();
    };
}
</script>
